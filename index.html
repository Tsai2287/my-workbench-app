<style>
  /* ===== Hello Kitty 50周年纪念 · 浅色简洁风格 ===== */
  :root{
    --pink:#FFB6C8;        /* Hello Kitty 蝴蝶结粉（点缀用） */
    --pink-deep:#E61E37;   /* 经典 Kitty 红 */
    --pink-soft:#FFF0F4;   /* 极淡粉底 */
    --cream:#FFFBF7;       /* 干净奶油白 */
    --sky:#A8D8E8;         /* 天空蓝点缀 */
    --yellow:#FFCD37;      /* Kitty 鼻子黄 */
    --line:#ECECF0;        /* 浅灰描边 */
    --line2:#F0F0F3;
    --txt:#3A3540;         /* 文字主色（深灰） */
    --txt2:#7A7480;        /* 次级文字 */
    --muted:#A8A2AE;       /* 最弱文字 */
    --good:#6FBF94;        /* 勾选绿（柔和） */
    --radius:18px;
    --shadow:0 4px 16px rgba(40,30,50,.06);
    /* 顶部安全区（防止 PWA 顶/底白条） */
    --safe-top:env(safe-area-inset-top, 0px);
    --safe-bot:env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Helvetica Neue",sans-serif;
    background:var(--cream);
    color:var(--txt);
    min-height:100vh; min-height:100dvh;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  /* 整体布局：用 min-height 而非 height，让 PWA 模式下不卡顶/底 */
  .app{display:flex;min-height:100vh;min-height:100dvh;}

  /* ===== 侧栏 ===== */
  .sidebar{
    width:240px; min-width:240px;
    background:rgba(255,249,242,.85);
    border-right:1px solid var(--line2);
    display:flex; flex-direction:column;
    padding:calc(18px + var(--safe-top)) 12px calc(18px + var(--safe-bot));
    gap:6px;
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
  }
  .brand{display:flex;align-items:center;gap:10px;padding:6px 10px 14px;}
  .brand .logo{
    width:42px;height:42px;border-radius:10px;
    background:transparent;
    display:flex;align-items:center;justify-content:center;
    box-shadow:none;
    border:none;overflow:hidden;flex-shrink:0;
  }
  .brand .logo img{width:100%;height:100%;object-fit:contain;display:block;}
  /* 侧栏拖拽 + 改名 */
  .nav-item{position:relative;user-select:none;-webkit-user-select:none;touch-action:pan-y;}
  .nav-item .drag-hint{position:absolute;opacity:0;font-size:9px;color:var(--muted);bottom:2px;right:6px;pointer-events:none;}
  .nav-item.dragging{opacity:.35;}
  .nav-drop-before{box-shadow:inset 0 3px 0 0 var(--pink-deep);}
  .nav-drop-after{box-shadow:inset 0 -3px 0 0 var(--pink-deep);}
  .nav-rename-btn{
    margin-left:auto;width:24px;height:24px;border-radius:50%;
    background:transparent;border:none;color:var(--muted);cursor:pointer;
    font-size:13px;display:flex;align-items:center;justify-content:center;
    padding:0;flex-shrink:0;
  }
  .nav-rename-btn:active{background:var(--pink-soft);color:var(--pink-deep);}
  .nav-rename-input{
    flex:1;border:1px solid var(--pink);border-radius:8px;
    padding:3px 6px;font:inherit;color:var(--txt);background:#fff;outline:none;
    min-width:0;
  }
  .brand h1{font-size:16px;margin:0;font-weight:700;color:var(--txt);letter-spacing:.5px;}
  .brand small{display:block;color:var(--muted);font-size:11px;font-weight:400;margin-top:1px;}
  .nav{display:flex;flex-direction:column;gap:4px;flex:1;overflow-y:auto;}
  .nav-item{
    display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;
    color:var(--txt2);font-size:15px;cursor:pointer;transition:.18s;border:1px solid transparent;
    background:transparent;
  }
  .nav-item .kico{width:32px;height:32px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
  .nav-item .kico img.kimg{width:30px;height:30px;object-fit:contain;display:block;}
  .nav-item .nav-label{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px;}
  .nav-item.active .kico img.kimg{filter:drop-shadow(0 0 4px rgba(230,30,55,.25));}
  .nav-item .badge{
    margin-left:auto;font-size:11px;background:var(--pink-soft);
    color:var(--pink-deep);padding:2px 9px;border-radius:20px;font-weight:600;
  }
  .nav-item:active{transform:scale(.98);}
  .nav-item.active{
    background:#fff;
    color:var(--txt);border-color:rgba(230,30,55,.25);
    font-weight:600;box-shadow:0 2px 8px rgba(230,30,55,.06);
  }
  .nav-item.active .badge{background:var(--pink-deep);color:#fff;}
  .side-foot{padding:10px 4px 4px;border-top:1px solid var(--line2);display:flex;flex-direction:column;gap:8px;margin-top:6px;}
  .btn-mini{
    font-size:13px;padding:9px;border-radius:12px;
    border:1px solid var(--line);background:#fff;color:var(--txt);
    text-align:center;cursor:pointer;transition:.15s;
  }
  .btn-mini:active{transform:scale(.97);background:var(--pink-soft);}

  /* ===== 主区 ===== */
  .main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative;}
  .topbar{
    padding:calc(14px + var(--safe-top)) 20px 8px;
    display:flex;align-items:center;gap:12px;
  }
  .topbar h2{margin:0;font-size:20px;font-weight:700;color:var(--txt);}
  .topbar .desc{color:var(--txt2);font-size:13px;margin-top:2px;}
  .topbar .menu-btn{
    display:none;font-size:22px;background:var(--pink-soft);border:none;
    color:var(--pink-deep);width:38px;height:38px;border-radius:12px;
    cursor:pointer;
  }
  .content{
    flex:1;overflow-y:auto;
    padding:4px 20px calc(40px + var(--safe-bot));
  }
  .card{
    background:#ffffff;
    border:1px solid var(--line2);
    border-radius:var(--radius);
    padding:16px 18px;margin-bottom:14px;
    box-shadow:var(--shadow);
    position:relative;
  }
  .card .kitty-stamp{
    position:absolute;top:14px;right:14px;width:30px;height:30px;opacity:.9;pointer-events:none;
  }
  .card .kitty-stamp img{width:30px;height:30px;object-fit:contain;display:block;}
  .card h3{margin:0 0 4px;font-size:16px;color:var(--txt);font-weight:700;padding-right:36px;}
  .card .hint{color:var(--txt2);font-size:13px;margin:0 0 12px;line-height:1.5;}

  /* 进度条 */
  .progress-wrap{margin:6px 0 2px;}
  .progress-track{height:9px;background:var(--pink-soft);border-radius:20px;overflow:hidden;}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--pink),var(--pink-deep));
    border-radius:20px;transition:width .4s;}
  .progress-label{font-size:12px;color:var(--txt2);margin-top:6px;display:flex;justify-content:space-between;}

  /* 检查项 */
  .check{display:flex;align-items:flex-start;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line2);}
  .check:last-child{border-bottom:none;}
  .check input{
    appearance:none;-webkit-appearance:none;
    width:22px;height:22px;border:2px solid var(--line);border-radius:7px;
    flex-shrink:0;margin-top:1px;cursor:pointer;position:relative;transition:.15s;
    background:#fff;
  }
  .check input:checked{background:var(--pink);border-color:var(--pink-deep);}
  .check input:checked::after{
    content:"♡";position:absolute;inset:0;color:#fff;font-size:14px;
    display:flex;align-items:center;justify-content:center;font-weight:700;
  }
  .check .ct{flex:1;}
  .check .ct .t{font-size:15px;color:var(--txt);}
  .check.done .ct .t{color:var(--muted);text-decoration:line-through;}
  .check .ct .n{font-size:12px;color:var(--txt2);margin-top:3px;line-height:1.4;}

  /* 标签 */
  .tag{display:inline-block;font-size:11px;padding:2px 9px;border-radius:20px;margin-right:6px;margin-top:4px;font-weight:500;}
  .tag.lv{background:rgba(168,216,232,.25);color:#5BA8BF;}
  .tag.tip{background:rgba(255,216,110,.25);color:#B58F2E;}
  .tag.must{background:rgba(255,143,163,.18);color:var(--pink-deep);}

  /* 按钮 */
  .btn{
    font-size:14px;padding:11px 16px;border-radius:14px;border:none;cursor:pointer;
    background:linear-gradient(135deg,var(--pink),var(--pink-deep));
    color:#fff;font-weight:600;transition:.15s;
    box-shadow:0 3px 10px rgba(255,143,163,.25);
  }
  .btn:active{transform:scale(.97);}
  .btn.ghost{background:#fff;color:var(--txt);border:1px solid var(--line);font-weight:500;box-shadow:none;}
  .btn.sm{padding:8px 13px;font-size:13px;}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}

  /* 分段控件 */
  .seg{display:flex;background:var(--pink-soft);border-radius:14px;padding:4px;gap:4px;flex-wrap:wrap;}
  .seg button{
    flex:1;min-width:70px;border:none;background:none;color:var(--txt2);
    padding:9px 10px;border-radius:11px;font-size:13px;cursor:pointer;transition:.15s;
    white-space:nowrap;
  }
  .seg button.on{background:var(--pink);color:#fff;font-weight:600;}

  /* 表单 */
  input[type=text],textarea,select{
    width:100%;background:#fff;border:1px solid var(--line);
    color:var(--txt);border-radius:12px;padding:11px 12px;
    font-size:14px;font-family:inherit;outline:none;
  }
  input:focus,textarea:focus,select:focus{border-color:var(--pink-deep);}
  textarea{resize:vertical;min-height:70px;}
  label.fld{display:block;font-size:12px;color:var(--txt2);margin:10px 0 5px;font-weight:500;}

  /* 城市迷雾 */
  .fog-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px;}
  .fog-cell{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:3/4;
    background:var(--pink-soft);border:1px solid var(--line);cursor:pointer;
  }
  .fog-cell img{width:100%;height:100%;object-fit:cover;display:block;}
  .fog-cell .fog{position:absolute;inset:0;background:rgba(255,233,239,.85);
    backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    color:var(--pink-deep);font-size:13px;gap:4px;transition:.3s;font-weight:500;}
  .fog-cell.unlocked .fog{opacity:0;pointer-events:none;}
  .fog-cell .meta{position:absolute;left:0;right:0;bottom:0;padding:10px;
    background:linear-gradient(transparent,rgba(90,74,85,.55));font-size:13px;color:#fff;}
  .fog-cell .meta b{font-size:14px;display:block;}
  .fog-cell .meta span{color:#FFD9E3;font-size:11px;}
  .add-cell{border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;
    color:var(--pink-deep);font-size:30px;background:transparent;}

  /* 读书 */
  .book{border:1px solid var(--line2);border-radius:16px;padding:14px;background:var(--cream);}
  .book h4{margin:0 0 4px;font-size:15px;color:var(--txt);font-weight:700;}
  .book .by{color:var(--txt2);font-size:12px;margin-bottom:8px;}
  .book .note{font-size:13px;color:var(--txt);line-height:1.5;white-space:pre-wrap;}
  .book .ops{display:flex;gap:8px;margin-top:10px;}

  /* 隐藏/空状态 */
  .hidden{display:none!important;}
  .empty{color:var(--muted);text-align:center;padding:40px 10px;font-size:14px;}

  /* Toast */
  .toast{
    position:fixed;bottom:calc(30px + var(--safe-bot));left:50%;
    transform:translateX(-50%) translateY(20px);
    background:#fff;border:1px solid var(--pink);color:var(--txt);
    padding:12px 20px;border-radius:30px;font-size:14px;
    opacity:0;pointer-events:none;transition:.3s;z-index:99;
    box-shadow:0 4px 16px rgba(255,143,163,.2);
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* 弹层 */
  .modal-mask{
    position:fixed;inset:0;background:rgba(90,74,85,.35);
    backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
    z-index:80;display:flex;align-items:flex-end;justify-content:center;
  }
  .modal{
    background:#fff;width:100%;max-width:480px;border-radius:24px 24px 0 0;
    padding:20px calc(20px + env(safe-area-inset-right,0px)) calc(20px + var(--safe-bot)) calc(20px + env(safe-area-inset-left,0px));
    max-height:88vh;overflow-y-auto;
    border-top:1px solid var(--line2);
    box-shadow:0 -8px 30px rgba(255,143,163,.15);
  }
  .modal h3{margin:0 0 14px;color:var(--txt);font-weight:700;}
  .modal .close{float:right;font-size:22px;color:var(--muted);cursor:pointer;background:none;border:none;}

  /* ===== Kitty 吉祥物（主区右下角） ===== */
  .mascot{
    position:fixed;right:14px;bottom:calc(14px + var(--safe-bot));
    width:100px;height:100px;z-index:30;
    filter:drop-shadow(0 3px 6px rgba(40,30,50,.12));
    transition:transform .25s ease;
    pointer-events:none;display:flex;align-items:center;justify-content:center;
  }
  .mascot img{width:100%;height:100%;object-fit:contain;display:block;}
  @media (max-width:760px){
    .mascot{right:10px;bottom:calc(10px + var(--safe-bot));width:88px;height:88px;}
  }

  /* ===== 设置模块：主题卡 ===== */
  .theme-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:8px;}
  .theme-card{
    background:#fff;border:2px solid var(--line);border-radius:14px;
    padding:10px 6px;display:flex;flex-direction:column;align-items:center;
    cursor:pointer;transition:.15s;gap:6px;
  }
  .theme-card.on{border-color:var(--pink-deep);box-shadow:0 2px 8px rgba(230,30,55,.15);}
  .theme-dot{width:36px;height:36px;border-radius:50%;border:3px solid #fff;
    box-shadow:inset 0 0 0 1.5px currentColor;}
  .theme-name{font-size:11px;color:var(--txt2);font-weight:500;}

  /* ===== 装饰图选 ===== */
  .mascot-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px;}
  .mascot-pick{
    background:#fff;border:2px solid var(--line);border-radius:14px;
    padding:10px 6px;display:flex;flex-direction:column;align-items:center;
    cursor:pointer;transition:.15s;gap:4px;
  }
  .mascot-pick.on{border-color:var(--pink-deep);box-shadow:0 2px 8px rgba(230,30,55,.15);}
  .mascot-prev{width:48px;height:48px;display:flex;align-items:center;justify-content:center;}
  .mascot-prev img{width:48px;height:48px;object-fit:contain;}
  .mascot-label{font-size:11px;color:var(--txt2);}

  /* ===== 分类管理 ===== */
  .cat-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
  .cat-row input{flex:1;}
  /* 分类标签 */
  .cat-tag{display:inline-block;background:var(--pink-soft);color:var(--pink-deep);
    font-size:11px;padding:1px 8px;border-radius:10px;margin-left:4px;}

  /* 移动端抽屉 */
  @media (max-width:760px){
    .sidebar{
      position:fixed;left:0;top:0;bottom:0;z-index:90;
      transform:translateX(-100%);transition:.28s;
      box-shadow:4px 0 20px rgba(255,143,163,.15);
    }
    .sidebar.open{transform:translateX(0);}
    .topbar .menu-btn{display:flex;align-items:center;justify-content:center;}
    .content{padding:4px 14px calc(40px + var(--safe-bot));}
    .topbar{padding:calc(12px + var(--safe-top)) 14px 6px;}
  }

  /* ===== 行李项目操作按钮 ===== */
  .check{position:relative;}
  .item-act{
    flex-shrink:0;width:30px;height:30px;border-radius:8px;border:none;background:transparent;
    color:var(--muted);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;
    margin-left:4px;transition:.15s;
  }
  .item-act:hover{background:var(--pink-soft);color:var(--pink-deep);}
  .check.custom{background:rgba(255,205,55,.06);border-radius:10px;margin:4px -4px;padding-left:8px;}
  .item-ops{display:flex;gap:2px;}
  .add-item{
    width:100%;margin-top:10px;padding:10px;border:1.5px dashed var(--line);
    background:transparent;color:var(--txt2);border-radius:12px;cursor:pointer;
    font-size:13px;transition:.15s;font-family:inherit;
  }
  .add-item:hover{border-color:var(--pink-deep);color:var(--pink-deep);background:var(--pink-soft);}
  .add-item:active{transform:scale(.98);}

  /* ===== 城市迷雾 列表/网格 视图 ===== */
  .view-toggle{
    display:flex;background:var(--pink-soft);border-radius:12px;padding:3px;gap:2px;width:fit-content;
  }
  .view-toggle button{
    border:none;background:none;padding:7px 14px;border-radius:10px;font-size:13px;
    color:var(--txt2);cursor:pointer;transition:.15s;font-family:inherit;
  }
  .view-toggle button.on{background:#fff;color:var(--pink-deep);font-weight:600;box-shadow:0 1px 4px rgba(230,30,55,.1);}
  .country-block{margin-bottom:16px;}
  .country-head{
    font-size:13px;font-weight:600;color:var(--txt2);padding:8px 4px 6px;
    border-bottom:1px solid var(--line2);margin-bottom:8px;
    display:flex;align-items:center;gap:8px;
  }
  .country-head .ct{
    background:var(--pink-soft);color:var(--pink-deep);font-size:11px;padding:1px 8px;border-radius:10px;
  }
  .city-row{
    display:flex;gap:12px;padding:10px;border-radius:12px;background:#fff;
    border:1px solid var(--line2);margin-bottom:8px;align-items:center;cursor:pointer;
    transition:.15s;
  }
  .city-row:active{transform:scale(.98);}
  .city-thumb{
    width:60px;height:60px;border-radius:10px;flex-shrink:0;background:var(--pink-soft);
    background-size:cover;background-position:center;overflow:hidden;
    display:flex;align-items:center;justify-content:center;color:var(--pink-deep);font-size:24px;
  }
  .city-info{flex:1;min-width:0;}
  .city-info .nm{font-size:15px;font-weight:600;color:var(--txt);margin-bottom:2px;}
  .city-info .co{font-size:12px;color:var(--muted);}
  .city-info .nt{font-size:12px;color:var(--txt2);margin-top:3px;line-height:1.4;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .city-row .ar{color:var(--muted);font-size:18px;}

  /* ===== 首页 样式 ===== */
  .home-hero{
    display:flex;align-items:center;gap:18px;flex-wrap:wrap;
    background:linear-gradient(135deg,#FFF6F9 0%,#FFF0F4 60%,#FFFBF7 100%);
    border:1px solid var(--line);box-shadow:var(--shadow);
  }
  .home-left{flex:1;min-width:220px;display:flex;flex-direction:column;gap:8px;}
  .home-time{font-size:46px;font-weight:200;letter-spacing:2px;color:var(--txt);line-height:1;font-variant-numeric:tabular-nums;}
  .home-date{font-size:14px;color:var(--txt2);font-weight:500;}
  .home-quote{font-size:14px;color:var(--txt2);font-style:italic;line-height:1.5;padding:6px 0;border-left:3px solid var(--pink);padding-left:10px;margin-top:4px;}
  .home-loc-row{display:flex;align-items:center;gap:10px;margin-top:6px;}
  .home-loc{font-size:12px;color:var(--muted);}
  .home-refresh{font-size:12px;padding:4px 10px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--txt2);cursor:pointer;}
  .home-refresh:active{background:var(--pink-soft);}
  .home-right{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:130px;}
  .home-weather{display:flex;align-items:center;gap:8px;font-size:18px;color:var(--txt);background:#fff;border:1px solid var(--line);border-radius:16px;padding:8px 14px;box-shadow:0 2px 6px rgba(40,30,50,.04);}
  .home-weather .wico{font-size:28px;line-height:1;}
  .home-weather .wtemp{font-weight:600;font-size:22px;font-variant-numeric:tabular-nums;}
  .home-weather .wdesc{font-size:13px;color:var(--txt2);}
  .home-weather .loading-dots{color:var(--muted);font-size:13px;}
  .home-kitty-wrap{width:84px;height:84px;border-radius:18px;background:#fff;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);overflow:hidden;}
  .home-kitty-wrap img{width:80px;height:80px;object-fit:contain;}

  .home-progress h3{margin:0 0 10px;font-size:15px;color:var(--txt);}
  .hp-row{display:grid;grid-template-columns:90px 1fr 100px;align-items:center;gap:10px;padding:6px 0;}
  .hp-label{font-size:13px;color:var(--txt2);}
  .hp-bar{height:8px;background:var(--line2);border-radius:6px;overflow:hidden;}
  .hp-fill{height:100%;background:linear-gradient(90deg,var(--pink),var(--pink-deep));border-radius:6px;transition:width .3s;}
  .hp-val{font-size:12px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;}

  .home-shortcut h3{margin:0 0 10px;font-size:15px;color:var(--txt);}
  .hs-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  .hs-tile{
    display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 6px;
    border:1px solid var(--line);border-radius:14px;background:#fff;cursor:pointer;
    font-size:13px;color:var(--txt2);transition:.15s;
  }
  .hs-tile:active{transform:scale(.96);background:var(--pink-soft);border-color:var(--pink);}
  .hs-tile span{font-size:12px;}
  .hs-tile:first-child{font-size:22px;}
  @media (max-width:420px){
    .hs-grid{grid-template-columns:repeat(4,1fr);gap:6px;}
    .hs-tile{padding:10px 4px;}
    .home-time{font-size:38px;}
  }
</style>

<div class="app">
  <!-- 侧栏 -->
  <aside class="sidebar" id="sidebar">

      <div class="logo" aria-hidden="true">
        <img id="bowLogo" src="" alt=""/>
      </div>

    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="btn-mini" id="btnExport">⬇️ 匯出備份</div>
      <div class="btn-mini" id="btnImport">⬆️ 匯入備份</div>

        <div class="desc" id="pageDesc"></div>
      </div>

</div>

<div id="modalRoot"></div>



<script>

/* ===== app.js ===== */
/* ============ 我的工作台 app.js ============ */
(function(){
'use strict';

/* ---------- 数据存储（纯本地 localStorage） ---------- */
const KEY = 'my_workbench_v1';
const defaultData = {
  korean: {},          // 韩文学习：{ [itemId]: true }
  luggage: {},         // 行李：{ [itemId]: true }
  luggageDays: 5,      // 行程天数
  luggageDest: 'kr',   // kr / jp / both
  luggageCustom: [],   // 行李自定义项：[{id, group, title, note}]
  luggageHidden: [],   // 默认行李项中被隐藏的 id（可恢复）
  luggageRename: {},   // 默认行李项改名：{ [id]: {title, note, group} }
  luggageDestText: '', // 目的地（自由文本）
  cities: [],          // 城市迷雾：[{id,country,city,photo(dataURL),date,note,unlocked}]
  citiesView: 'list',  // 城市视图：'list' | 'grid'
  books: [],           // 读书：[{id,title,author,note,date,cat}]
  // === 用户设置（新增）===
  theme: 'cream',      // 当前主题：cream/strawberry/mint/lavender/butter
  customColor: '',     // 自定义强调色（hex）
  mascot: 'bike',      // 吉祥物选哪张：bike/bear/face
  bookCats: [{id:'want',name:'待看'},{id:'done',name:'已看完'},{id:'drop',name:'不看了'}],
  // === 侧栏顺序 + 改名（新增）===
  navOrder: ['home','korean','luggage','cities','books','settings'],
  navRename: {},        // { [moduleId]: '自定义名' }
  // === 首页天气（新增）===
  homeWeather: null,    // {temp, code, city, fetchedAt}
  homeLoc: null         // {lat, lon, label}
};
let DB = load();

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return JSON.parse(JSON.stringify(defaultData));
    const d = JSON.parse(raw);
    return Object.assign(JSON.parse(JSON.stringify(defaultData)), d);
  }catch(e){ return JSON.parse(JSON.stringify(defaultData)); }
}
function save(){ localStorage.setItem(KEY, JSON.stringify(DB)); }

/* ---------- 工具 ---------- */
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>Array.from(r.querySelectorAll(s));
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function esc(s){ return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fmtDate(d){ if(!d) return ''; try{ return new Date(d).toLocaleDateString('zh-Hant'); }catch(e){ return d; } }
let toastTimer;
function toast(msg){
  const t=$('#toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),1800);
}

/* ---------- 模块注册 ---------- */
const modules = {};
function registerModule(id, def){ def.id=id; modules[id]=def; }

/* ---------- 导航渲染（支持拖拽排序 + 改名） ---------- */
function getNavItems(){
  // 用 navOrder 排序，未列入的追加到末尾
  const order = Array.isArray(DB.navOrder) ? DB.navOrder : ['home','korean','luggage','cities','books','settings'];
  const known = new Set(Object.keys(modules));
  const list = order.filter(id=>known.has(id));

function startRename(el, id){
  if(el.classList.contains('renaming')) return;
  el.classList.add('renaming');
  const labelEl = el.querySelector('.nav-label');
  const oldName = labelEl.textContent;
  const input = document.createElement('input');
  input.type='text'; input.className='nav-rename-input'; input.value=oldName; input.maxLength=12;
  labelEl.replaceWith(input);
  input.focus(); input.select();
  const finish=(commit)=>{
    if(!el.classList.contains('renaming')) return;
    el.classList.remove('renaming');
    const v = commit? (input.value.trim() || oldName) : oldName;
    if(commit && v!==oldName){
      DB.navRename = DB.navRename || {};
      // 如果改回原始名就清掉
      if(v === (modules[id] && modules[id].name)) delete DB.navRename[id];
      else DB.navRename[id] = v;
      save();
    }
    const newLabel = document.createElement('span');
    newLabel.className='nav-label'; newLabel.textContent=v;
    input.replaceWith(newLabel);
  };
  input.onblur=()=>finish(true);
  input.onkeydown=(e)=>{
    if(e.key==='Enter'){ e.preventDefault(); input.blur(); }
    else if(e.key==='Escape'){ e.preventDefault(); finish(false); }
    e.stopPropagation();
  };
}

/* 侧栏拖拽排序：长按 0.5s 启动，PC 端鼠标直接拖 */
let _navDrag = null;
function setupNavDrag(){
  const nav = $('#nav');
  const items = $$('.nav-item', nav);
  items.forEach(el=>{
    let pressTimer=null, startX=0, startY=0, dragging=false, longFired=false;
    const onDown=(e)=>{
      // 改名输入时不启动
      if(el.classList.contains('renaming')) return;
      const t = e.touches? e.touches[0] : e;
      startX=t.clientX; startY=t.clientY;
      dragging=false; longFired=false;
      // 长按 500ms：先进入「待定」，之后分两路——移动则拖拽，松手则改名
      pressTimer=setTimeout(()=>{
        longFired=true;
        if(!dragging){
          // 还没移动 → 触发改名
          startRename(el, el.dataset.id);
        }
      }, 500);
    };
    const onMove=(e)=>{
      if(!pressTimer && !dragging) return;
      const t = e.touches? e.touches[0] : e;
      const dx=t.clientX-startX, dy=t.clientY-startY;
      if(!dragging && Math.hypot(dx,dy)>8){
        // 移动超过阈值 → 升级为拖拽
        clearTimeout(pressTimer); pressTimer=null;
        dragging=true; el.classList.add('dragging');
        try{navigator.vibrate&&navigator.vibrate(20);}catch(_){}
      }
      if(!dragging) return;
      e.preventDefault();
      // 找当前 hover 目标
      const els = items.filter(x=>x!==el && !x.classList.contains('dragging'));
      els.forEach(x=>x.classList.remove('nav-drop-before','nav-drop-after'));
      const y = t.clientY;
      let target=null, where='after';
      for(const x of els){
        const r = x.getBoundingClientRect();
        if(y>=r.top && y<=r.bottom){
          target=x; where = (y - r.top < r.height/2)? 'before':'after';
          break;
        }
      }
      if(target){
        target.classList.add(where==='before'?'nav-drop-before':'nav-drop-after');
        _navDrag._target=target; _navDrag._where=where;
      } else { _navDrag._target=null; }
    };
    const onUp=()=>{
      clearTimeout(pressTimer); pressTimer=null;
      if(!dragging){ return; } // 改名已在长按里处理，这里不做事
      dragging=false; el.classList.remove('dragging');
      const target=_navDrag._target, where=_navDrag._where;
      items.forEach(x=>x.classList.remove('nav-drop-before','nav-drop-after'));
      if(target && where){
        const movingId = el.dataset.id;
        let order = getNavItems();
        const oldIdx = order.indexOf(movingId);
        if(oldIdx>=0) order.splice(oldIdx,1);
        let newIdx = order.indexOf(target.dataset.id);
        if(where==='after') newIdx++;
        order.splice(newIdx, 0, movingId);
        DB.navOrder = order;
        save();
        renderNav();
        if(typeof toast==='function') toast('已重新排列');
      }
    };
    el.ontouchstart = el.onmousedown = onDown;
    el.ontouchmove = el.onmousemove = onMove;
    el.ontouchend = el.onmouseup = el.onmouseleave = onUp;
  });
  _navDrag = _navDrag || {};
}

function renderCheckList(container, items, store, groupTitle){
  // items: [{id,title,note,tags:[{t,c}]}]
  const total=items.length;
  const done=items.filter(i=>store[i.id]).length;
  const pct= total? Math.round(done/total*100):0;
  let html=`<div class="card">
    <div class="kitty-stamp">${window.KITTY_IMGS?`<img src="${window.KITTY_IMGS.face}" alt=""/>`:window.KITTY({size:24})}</div>
    <h3>${groupTitle}</h3>
    <div class="progress-wrap">
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="progress-label"><span>${done}/${total} 完成</span><span>${pct}%</span></div>
    </div>
    <div style="margin-top:10px">`;
  items.forEach(it=>{
    const checked=store[it.id]?'checked':'';
    const tags=(it.tags||[]).map(t=>`<span class="tag ${t.c}">${t.t}</span>`).join('');
    html+=`<label class="check ${store[it.id]?'done':''}" data-id="${it.id}">
      <input type="checkbox" ${checked}/>
      <div class="ct"><div class="t">${esc(it.title)}</div>
      ${it.note?`<div class="n">${esc(it.note)}</div>`:''}
      ${tags?`<div>${tags}</div>`:''}</div></label>`;
  });
  html+='</div></div>';
  container.insertAdjacentHTML('beforeend',html);
  container.querySelectorAll(`.check`).forEach(l=>{
    const id=l.dataset.id;
    l.querySelector('input').onchange=(e)=>{
      store[id]=e.target.checked; save();
      l.classList.toggle('done',e.target.checked);
      // 更新进度
      const items2=Array.from(container.querySelectorAll('.check'));
      const d2=items2.filter(x=>x.classList.contains('done')).length;
      const p2=Math.round(d2/items2.length*100);
      const card=l.closest('.card');
      card.querySelector('.progress-fill').style.width=p2+'%';
      card.querySelector('.progress-label').innerHTML=`<span>${d2}/${items2.length} 完成</span><span>${p2}%</span>`;
      refreshBadges();
    };
  });
}

        const url=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code&timezone=auto`;
        const r=await fetch(url);
        const j=await r.json();
        if(!j.current) throw new Error('no current');
        // 没有给定地区名时，用反向地理编码推测（免费、免 key）
        let area = label || '';
        if(!area){
          try{
            const g=await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=zh`);
            const gd=await g.json();
            area = gd.city || gd.locality || gd.principalSubdivision || gd.countryName || '';
          }catch(_){ area=''; }
        }
        WB.DB.homeWeather = {temp:Math.round(j.current.temperature_2m), code:j.current.weather_code, city:area, fetchedAt:Date.now()};
        WB.DB.homeLoc = {lat, lon, label:area};
        WB.save();
        paintWeather(WB.DB.homeWeather, area);
      }catch(e){
        box.innerHTML='<span class="muted">天氣暫時讀不到 😅</span>';
      }
    };
    if(navigator.geolocation){
      navigator.geolocation.getCurrentPosition(
        pos=>tryFetch(pos.coords.latitude, pos.coords.longitude, ''),
        ()=>tryFetch(25.033, 121.565, '台北'),
        {timeout:6000, maximumAge:600000}
      );
    }else{
      tryFetch(25.033, 121.565, '台北');
    }
  }

    // WMO weather code → 图标 + 文字
    const map={
      0:['☀️','晴'],1:['🌤️','多雲'],2:['⛅','多雲'],3:['☁️','陰'],
      45:['🌫️','霧'],48:['🌫️','霧'],
      51:['🌦️','毛雨'],53:['🌦️','毛雨'],55:['🌦️','毛雨'],
      61:['🌧️','小雨'],63:['🌧️','中雨'],65:['🌧️','大雨'],
      71:['🌨️','雪'],73:['🌨️','雪'],75:['🌨️','大雪'],
      80:['🌦️','陣雨'],81:['🌧️','陣雨'],82:['⛈️','豪雨'],
      95:['⛈️','雷雨'],96:['⛈️','雷雨'],99:['⛈️','雷雨']
    };
    const it=map[w.code]||['🌡️',''];

  function luggageBaseItems(){
    // 把 base 展平成 [{id,title,note,tags,group,base:true}]，並套用 rename overrides
    const hidden = new Set(WB.DB.luggageHidden||[]);
    const out = [];
    luggageBase.forEach(g=>{
      g.items.forEach(it=>{
        if(hidden.has(it.id)) return;
        out.push({id:it.id, title:it.title, note:it.note, tags:it.tags, group:g.grp, base:true});
      });
    });
    const rn = WB.DB.luggageRename||{};
    return out.map(it=>{
      const r = rn[it.id];
      if(r) return {...it, title:r.title, note:r.note, group:r.group};
      return it;
    });
  }
  function luggageCustomItems(){
    return (WB.DB.luggageCustom||[]).map(it=>({
      id:it.id, title:it.title, note:it.note||'', group:it.group, base:false
    }));
  }
  function luggageAllItems(){
    return luggageBaseItems().concat(luggageCustomItems());
  }
  function luggageProgress(){

  /* ---------- 行李項目 API（基礎項也可改名/隱藏；自訂項可增刪改） ---------- */
  WB._addLuggage = function(group){
    WB._luggageEditing = null;
    WB._luggageGroup = group;
    openLuggageModal();
  };
  WB._editLuggage = function(id){
    const base = luggageBaseItems().find(x=>x.id===id);
    const cust = luggageCustomItems().find(x=>x.id===id);
    const it = base || cust;
    if(!it) return;
    WB._luggageEditing = {id, isBase: !!base, group: it.group, title: it.title, note: it.note||''};
    WB._luggageGroup = it.group;
    openLuggageModal();
  };
  WB._delLuggage = function(id){
    if(!confirm('確定刪除這個項目？')) return;
    WB.DB.luggageCustom = (WB.DB.luggageCustom||[]).filter(x=>x.id!==id);
    delete WB.DB.luggage[id];
    WB.save(); WB.go('luggage'); WB.toast('已刪除 🗑');
  };
  WB._hideLuggage = function(id){
    if(!WB.DB.luggageHidden) WB.DB.luggageHidden = [];
    if(WB.DB.luggageHidden.indexOf(id)<0) WB.DB.luggageHidden.push(id);
    WB.save(); WB.go('luggage'); WB.toast('已隱藏，可從頂部「全部恢復」');
  };
  WB._restoreAllLuggage = function(){
    WB.DB.luggageHidden = [];
    WB.save(); WB.go('luggage'); WB.toast('已全部恢復');
  };
  WB._selectAllLuggage = function(){
    luggageAllItems().forEach(it=>{ WB.DB.luggage[it.id]=true; });
    WB.save(); WB.go('luggage'); WB.toast('已全部勾選 ☑️');
  };
  WB._clearAllLuggage = function(){
    luggageAllItems().forEach(it=>{ WB.DB.luggage[it.id]=false; });
    WB.save(); WB.go('luggage'); WB.toast('已清除所有勾選 🔲');
  };
  WB._saveLuggage = function(){
    const title = $('#mLTitle').value.trim();
    const note = $('#mLNote').value.trim();
    const grp = $('#mLGroup')? $('#mLGroup').value : WB._luggageGroup;
    if(!title){ WB.toast('請填寫項目名稱'); return; }
    if(WB._luggageEditing){
      const ed = WB._luggageEditing;
      if(ed.isBase){
        // 基礎項改名：存到 overrides
        if(!WB.DB.luggageRename) WB.DB.luggageRename={};
        WB.DB.luggageRename[ed.id] = {title, note, group:grp};
      } else {
        const it = (WB.DB.luggageCustom||[]).find(x=>x.id===ed.id);
        if(it){ it.title=title; it.note=note; it.group=grp; }
      }
    } else {
      WB.DB.luggageCustom = WB.DB.luggageCustom||[];
      WB.DB.luggageCustom.push({
        id:'lc_'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),
        group: grp, title, note
      });
    }
    WB._luggageEditing = null;
    WB.save(); WB._closeModal(); WB.go('luggage');
    WB.toast('已儲存 ✅');
  };

  function openLuggageModal(){
    const e = WB._luggageEditing;
    const groups = luggageBase.map(g=>g.grp);
    const groupOpts = groups.map(g=>`<option value="${esc(g)}" ${e&&e.group===g?'selected':(WB._luggageGroup===g?'selected':'')}>${esc(g)}</option>`).join('');

  // 圖片壓縮
  function compressImage(dataUrl, maxW, cb){
    const img=new Image();
    img.onload=()=>{
      const scale=Math.min(1, maxW/img.width);
      const w=img.width*scale, h=img.height*scale;
      const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      cb(cv.toDataURL('image/jpeg',0.7));
    };
    img.src=dataUrl;
  }
  // 讀 EXIF GPS（輕量解析，依賴 exif 位置；若無則不填）
  function readExifLocation(file, cb){
    const fr=new FileReader();
    fr.onload=()=>{
      try{
        const view=new DataView(fr.result);
        if(view.getUint16(0)!==0xFFD8){ cb(null); return; }
        let off=2, len=fr.result.byteLength;
        while(off<len){
          if(view.getUint16(off)===0xFFE1){
            const exifStart=off+4, tiffOff=exifStart;
            if(view.getUint16(tiffOff)==0x4949){ var little=true; } else { var little=false; }
            const get16=(o)=>view.getUint16(o, little);
            const get32=(o)=>view.getUint32(o, little);
            const ifd0=get32(tiffOff+4)+tiffOff;
            const tags=get16(ifd0);
            let gpsOff=0;
            for(let i=0;i<tags;i++){
              const tag=get16(ifd0+2+i*12);
              if(tag===0x8825){ gpsOff=get32(ifd0+2+i*12+8)+tiffOff; break; }
            }
            if(!gpsOff){ cb(null); return; }
            const gtags=get16(gpsOff);
            let latR,latD,latM,latS,lonR,lonD,lonM,lonS;
            const rd=(o)=>get32(o)+(get32(o+4)/get32(o+8));
            for(let i=0;i<gtags;i++){
              const p=gpsOff+2+i*12, t=get16(p);
              if(t===1) latR=get16(p+8);
              if(t===2) latD=rd(p+8),latM=rd(p+8+8),latS=rd(p+8+16);
              if(t===3) lonR=get16(p+8);
              if(t===4) lonD=rd(p+8),lonM=rd(p+8+8),lonS=rd(p+8+16);
            }
            if(latD==null||lonD==null){ cb(null); return; }
            let lat=latD+latM/60+latS/3600; if(latR===83) lat=-lat;
            let lon=lonD+lonM/60+lonS/3600; if(lonR===87) lon=-lon;
            reverseGeocode(lat,lon,cb);
            return;
          }
          off+=2+view.getUint16(off+2);
        }
        cb(null);
      }catch(e){ cb(null); }
    };
    fr.readAsArrayBuffer(file.slice(0,131072)); // 只讀前段 EXIF
  }
  // 經緯度轉城市名（用免費 Nominatim，需聯網；失敗則只給座標）
  function reverseGeocode(lat,lon,cb){
    const url=`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=10&accept-language=zh-TW`;
    fetch(url,{headers:{'Accept':'application/json'}}).then(r=>r.json()).then(d=>{
      const a=d.address||{};
      const country=a.country||a.state||'';
      const city=a.city||a.town||a.village||a.county||'';
      cb({country,city,lat,lon});
    }).catch(()=>cb({country:'',city:'',lat,lon}));
  }

          <button class="btn ghost sm" onclick="WB._delCat('${c.id}')">刪除</button>
        </div>`).join('');

      root.innerHTML=`
        <div class="card">
          <h3>🎨 主題換膚</h3>
          <p class="hint">選一個你喜歡的主色，全站配色會即時切換。</p>
          <div class="theme-grid">${themeCards}</div>
          <div class="row" style="margin-top:14px;align-items:center;">
            <input type="color" id="customColor" value="${WB.DB.customColor||'#FF8FA3'}" style="width:48px;height:36px;border:1px solid var(--line);border-radius:10px;background:transparent;padding:0;cursor:pointer"/>
            <span style="flex:1;color:var(--txt2);font-size:13px;">自訂強調色</span>
            <button class="btn sm" onclick="WB._applyCustomColor()">應用 ✦</button>
          </div>
        </div>

        <div class="card">
          <h3>🖼️ 主題裝飾</h3>
          <p class="hint">選擇一張 Kitty 圖案作為主區右下的吉祥物。預設隨模組陪伴你。</p>
          <div class="mascot-grid">${mascotCards}</div>
          <div style="margin-top:14px;text-align:center;">
              <div style="background:var(--cream);border-radius:18px;padding:18px;display:inline-block;border:1px solid var(--line2)">
                ${window.KITTY_IMGS&&window.KITTY_IMGS[mascot]?`<img src="${window.KITTY_IMGS[mascot]}" style="max-width:180px;max-height:200px;"/>`:''}
              </div>
              <div style="color:var(--muted);font-size:12px;margin-top:8px;">${mascots.find(x=>x.key===mascot)?.label} · 當前吉祥物</div>
            </div>
        </div>

        <div class="card">
          <h3>📚 讀書分類管理</h3>
          <p class="hint">自訂你的讀書分類（待看 / 已看完 / 不看了 等），可改名、刪除、新增。書本歸類在新增時選擇。</p>
          <div id="catList">${catList}</div>
          <div class="row" style="margin-top:10px;">
            <input type="text" id="newCatName" placeholder="新分類名稱（例：在讀）" style="flex:1"/>
            <button class="btn sm" onclick="WB._addCat()">＋ 新增分類</button>
          </div>
        </div>

        <div class="card">
          <h3>💾 資料管理</h3>
          <button class="btn ghost sm" onclick="WB._export()">⬇️  匯出備份</button>
          <button class="btn ghost sm" onclick="$('#importFile').click();$('#sidebar').classList.remove('open');" style="margin-left:8px">⬆️  匯入備份</button>
        </div>
      `;
      // 主题点击
      root.querySelectorAll('.theme-card').forEach(c=>{
        c.onclick=()=>{
          WB.DB.theme=c.dataset.theme;
          WB.save(); WB.applyTheme(); WB.toast('已切換主題 ✨');
          WB.go('settings');
        };
      });
      // 装饰图点击
      root.querySelectorAll('.mascot-pick').forEach(c=>{
        c.onclick=()=>{
          WB.DB.mascot=c.dataset.m;
          WB.save(); WB.toast('已更換裝飾 ✨');
          // 立即刷新主区吉祥物
          const mEl=$('#mascot');
          if(mEl&&window.KITTY_IMGS&&window.KITTY_IMGS[WB.DB.mascot]){
            mEl.innerHTML=`<img src="${window.KITTY_IMGS[WB.DB.mascot]}" alt=""/>`;
          }
          WB.go('settings');
        };
      });
      // 分类改名
      root.querySelectorAll('#catList input').forEach(inp=>{
        inp.onchange=(e)=>{
          const c = WB.DB.bookCats.find(c=>c.id===e.target.dataset.cid);
          if(c){ c.name=e.target.value.trim()||c.name; WB.save(); WB.toast('已更新分類名'); }
        };
      });
    }
  });

  WB._applyCustomColor=function(){
    const v=$('#customColor').value;
    WB.DB.customColor=v; WB.save(); WB.applyTheme(); WB.toast('已套用自訂色 🎨');
    WB.go('settings');
  };
  WB._addCat=function(){
    const name=($('#newCatName').value||'').trim();
    if(!name){ WB.toast('請填寫分類名'); return; }
    const id='c_'+WB.uid();
    WB.DB.bookCats.push({id,name});
    WB.save(); WB.toast('已新增分類'); WB.go('settings');
  };
  WB._delCat=function(id){
    WB.DB.bookCats = WB.DB.bookCats.filter(c=>c.id!==id);
    WB.save(); WB.toast('已刪除'); WB.go('settings');
  };
  WB._export = function(){
    const blob=new Blob([JSON.stringify(WB.DB,null,2)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='workbench-backup-'+new Date().toISOString().slice(0,10)+'.json';
    a.click(); URL.revokeObjectURL(a.href);
    WB.toast('已匯出備份檔');
  };

};

</script>
</body>
</html>
